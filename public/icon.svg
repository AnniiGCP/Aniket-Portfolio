<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f18" />
      <stop offset="100%" stop-color="#04070c" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Background Container -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="16" />
  
  <!-- Subtle Inner Glow / Tech Accent Line -->
  <rect x="36" y="36" width="440" height="440" rx="90" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2" />
  
  <!-- Monogram AY Text -->
  <text x="256" y="325" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="210" 
        font-weight="900" 
        letter-spacing="-6" 
        text-anchor="middle" 
        fill="url(#textGrad)">AY</text>
  
  <!-- Tiny Emerald Tech Dot in corner -->
  <circle cx="395" cy="140" r="14" fill="#10b981" />
</svg>
